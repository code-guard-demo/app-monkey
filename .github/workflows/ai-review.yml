name: AI PR Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review]

permissions:
  contents: read
  pull-requests: write
  issues: read

jobs:
  ai-review:
    uses: code-guard-demo/app-central/.github/workflows/reusable-review.yml@v0.6
    with:
      provider: "claude"
      central_ref: "v0.6"
      ci_command: "npm run lint && npm test"
    secrets:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      SKILLS_REPO_TOKEN: ${{ secrets.SKILLS_REPO_TOKEN }}
