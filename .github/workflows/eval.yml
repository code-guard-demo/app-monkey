name: Eval AI PR Reviewer

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  eval:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout app-central
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: code-guard-demo/app-central
          ref: main
          token: ${{ secrets.SKILLS_REPO_TOKEN }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"

      - name: Run unit tests
        run: npm test

      - name: Run live provider eval
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          node eval/run-eval.js
          cat eval-report.md >> "$GITHUB_STEP_SUMMARY"
